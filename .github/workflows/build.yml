name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Tycho 4.0.x 는 Maven 3.10 과 호환되지 않으므로(runner 기본값) 3.9.x 로 고정한다.
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.11

      - name: Build (Tycho)
        run: |
          set -o pipefail
          { mvn -v; mvn -B -e clean verify; } 2>&1 | tee build.log || {
            echo "::error title=Maven build failed::$(head -6 build.log | tr '\n' '|') ## $(grep -E 'ERROR|Caused by' build.log | grep -v '^\[ERROR\] *$' | sed -n '1,3p;/Caused by/p' | head -12 | tr '\n' '|' | cut -c1-1500)"
            exit 1
          }

      - name: Collect artifacts
        run: |
          rc=0
          bash .github/scripts/collect.sh > collect.log 2>&1 || rc=$?
          echo "::notice title=collect rc=$rc::$(tr '\n' '|' < collect.log | cut -c1-1500)"
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: kcube-markdown-viewer
          path: dist/*

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
