name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (Tycho)
        run: |
          mvn -v
          mvn -B -e clean verify 2>&1 | tee build.log || {
            echo "::error title=Maven build failed::$(grep -E 'ERROR|Caused by|BUILD' build.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Collect artifacts
        run: |
          set -e
          ls -l com.kcube.md/target/*.jar com.kcube.md.update-site/target/*.zip
          mkdir -p dist
          JAR="$(ls com.kcube.md/target/com.kcube.md-*.jar | grep -v -e sources -e javadoc | head -1)"
          ZIP="$(ls com.kcube.md.update-site/target/com.kcube.md.update-site-*.zip | head -1)"
          VERSION="$(unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Bundle-Version: *//p' | cut -d. -f1-3)"
          cp "$JAR" "dist/com.kcube.md.kcube-markdown-viewer-${VERSION}.jar"
          cp "$ZIP" "dist/kcube-markdown-viewer-update-site-${VERSION}.zip"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: kcube-markdown-viewer
          path: dist/*

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
