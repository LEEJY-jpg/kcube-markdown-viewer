name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (Tycho)
        run: |
          mvn -v
          mvn -B -e clean verify 2>&1 | tee build.log || {
            echo "::error title=Maven build failed::$(grep -E 'ERROR|Caused by|BUILD' build.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Collect artifacts
        run: |
          rc=0
          bash .github/scripts/collect.sh > collect.log 2>&1 || rc=$?
          echo "::notice title=collect rc=$rc::$(tr '\n' '|' < collect.log | cut -c1-1500)"
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: kcube-markdown-viewer
          path: dist/*

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
